<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameRover</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('gamerover-theme') || 'dark';</script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #202124;
      --sidebar: #191a1d;
      --surface: #292a2e;
      --surface-2: #303136;
      --line: #37383d;
      --text: #ececf1;
      --muted: #9699a2;
      --blue: #4d6bfe;
      --blue-soft: rgba(77, 107, 254, .15);
      --green: #45c49d;
      --red: #ff7188;
      --header-height: 64px;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --surface: #f3f4f6;
      --surface-2: #e9ebef;
      --line: #e2e4e8;
      --text: #202124;
      --muted: #6f737c;
      --blue-soft: rgba(77, 107, 254, .1);
      --green: #19966f;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--text); background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, textarea, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { border-radius: 8px; background: #45464c; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app { display: grid; grid-template-columns: 238px minmax(520px, 1fr) 372px; width: 100%; height: 100%; min-height: 0; transition: grid-template-columns .22s ease; }
    .app.drawer-closed { grid-template-columns: 0 minmax(520px, 1fr) 372px; }
    .history, .trace, .chat { min-width: 0; min-height: 0; }
    .history { display: flex; overflow: hidden; flex-direction: column; border-right: 1px solid var(--line); background: var(--sidebar); opacity: 1; transform: translateX(0); transition: opacity .18s, transform .22s; }
    .drawer-closed .history { border-right: 0; opacity: 0; pointer-events: none; transform: translateX(-100%); }
    .history-head { padding: 18px 13px 10px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 3px 7px 17px; font-size: 16px; font-weight: 700; }
    .brand-name { display: flex; min-width: 0; align-items: center; gap: 9px; }
    .brand-symbol { color: #8ea0ff; font-size: 20px; }
    .new-chat { width: 100%; padding: 11px 13px; border: 1px solid #5369d7; border-radius: 10px; background: var(--blue-soft); text-align: left; }
    .new-chat:hover { background: rgba(77, 107, 254, .24); }
    .history-label { padding: 14px 20px 7px; color: var(--muted); font-size: 12px; }
    .session-list { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 18px; }
    .session-row { position: relative; display: flex; width: 100%; margin: 2px 0; align-items: center; border-radius: 8px; color: #c7c9d0; }
    .session-row:hover { background: #242529; }
    .session-row.active { color: #fff; background: var(--surface); }
    .session-item { min-width: 0; flex: 1; padding: 10px 7px 10px 12px; overflow: hidden; border: 0; border-radius: 8px; color: inherit; background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .session-more { display: grid; width: 32px; height: 32px; flex: 0 0 32px; margin-right: 3px; place-items: center; border: 0; border-radius: 50%; color: var(--muted); background: transparent; font-size: 17px; letter-spacing: 1px; opacity: 0; }
    .session-row:hover .session-more, .session-row.menu-open .session-more { opacity: 1; }
    .session-more:hover, .session-row.menu-open .session-more { color: var(--text); background: rgba(127,127,127,.14); }
    .session-menu { position: absolute; z-index: 30; top: 37px; right: 3px; display: none; width: 132px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 12px 32px rgba(0,0,0,.28); }
    .session-row.menu-open { z-index: 29; }
    .session-row.menu-open .session-menu { display: block; }
    .session-menu-item { display: flex; width: 100%; align-items: center; gap: 9px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .session-menu-item:hover { background: rgba(127,127,127,.13); }
    .session-menu-item.delete { color: var(--red); }
    .session-menu-icon { width: 17px; text-align: center; }
    .session-row.editing { background: transparent; box-shadow: 0 0 0 2px var(--blue); }
    .session-row.editing .session-more { display: none; }
    .session-rename-input { width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; color: var(--text); background: var(--surface); outline: 0; }
    .history-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .chat { display: flex; flex-direction: column; background: var(--bg); }
    .topbar { display: flex; height: var(--header-height); min-height: var(--header-height); flex: 0 0 var(--header-height); align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .chat.welcome-mode .topbar { position: absolute; z-index: 3; top: 0; right: 372px; left: 238px; border-bottom: 0; background: transparent; pointer-events: none; }
    .drawer-closed .chat.welcome-mode .topbar { left: 0; }
    .chat.welcome-mode .topbar-left { visibility: hidden; }
    .chat.welcome-mode .topbar-actions { margin-left: auto; pointer-events: auto; }
    .topbar-left, .topbar-actions { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .topbar-left { flex: 1; }
    .topbar-actions { flex: 0 0 auto; }
    .topbar-icon { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border: 0; border-radius: 8px; color: var(--muted); background: transparent; }
    .topbar-icon:hover { color: var(--text); background: var(--surface); }
    .topbar-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .drawer-reopen { display: none; }
    .drawer-closed .drawer-reopen { display: grid; }
    .topbar-title { min-width: 0; font-size: 14px; font-weight: 650; white-space: nowrap; }
    .messages-wrap { position: relative; flex: 1; min-height: 0; }
    .messages { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; padding: 36px clamp(24px, 7vw, 108px) 48px; }
    .welcome { max-width: 680px; margin: 11vh auto 0; text-align: center; }
    .welcome-symbol { color: #899cff; font-size: 42px; }
    .welcome h1 { margin: 17px 0 9px; font-size: 28px; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.75; }
    .suggestions { display: grid; max-width: 620px; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 24px auto 0; }
    .suggestion { min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: #d2d4da; background: #26272b; font-size: 12px; text-align: left; line-height: 1.4; }
    .suggestion:hover { border-color: #596ed5; background: #2c2d32; }
    .message { width: min(860px, 100%); margin: 0 auto 29px; }
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .bubble { overflow-wrap: anywhere; }
    .user .bubble { max-width: 78%; padding: 12px 16px; border-radius: 15px; background: #34353a; line-height: 1.65; white-space: pre-wrap; }
    .assistant .bubble { width: 100%; color: #e6e7eb; font-size: 15px; line-height: 1.82; }
    .assistant .bubble.streaming-text { white-space: pre-wrap; }
    .thinking { color: var(--muted); }
    .thinking::before { display: inline-block; margin-right: 9px; color: #8ca0ff; content: "✣"; animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message-actions { margin-top: 8px; opacity: .65; }
    .copy-btn { display: grid; width: 32px; height: 32px; padding: 0; place-items: center; border: 0; border-radius: 7px; color: var(--muted); background: transparent; }
    .copy-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .copy-btn:hover { color: var(--text); background: #2c2d31; }
    .jump-bottom { position: absolute; right: 25px; bottom: 17px; display: none; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: #2d2e33; box-shadow: 0 5px 18px rgba(0,0,0,.3); }
    .jump-bottom.visible { display: block; }

    .markdown h1, .markdown h2, .markdown h3 { margin: 1.35em 0 .55em; line-height: 1.35; }
    .markdown h1 { font-size: 1.45em; } .markdown h2 { font-size: 1.26em; } .markdown h3 { font-size: 1.1em; }
    .markdown p { margin: .7em 0; }
    .markdown ul, .markdown ol { margin: .65em 0; padding-left: 1.55em; }
    .markdown li { margin: .3em 0; }
    .markdown strong { color: #f6f6f8; }
    .markdown a { color: #8fa4ff; text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }
    .markdown code { padding: .15em .38em; border-radius: 5px; background: #303136; font-family: "SFMono-Regular", Consolas, monospace; font-size: .9em; }
    .markdown pre { overflow-x: auto; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #17181b; }
    .markdown pre code { padding: 0; background: none; }
    .markdown blockquote { margin: .8em 0; padding: 2px 0 2px 14px; border-left: 3px solid #6679dd; color: #b7bac3; }
    .markdown hr { margin: 1.4em 0; border: 0; border-top: 1px solid var(--line); }
    .markdown-table-wrap { width: 100%; margin: 1em 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    .markdown table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: .94em; line-height: 1.55; }
    .markdown th, .markdown td { padding: 10px 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .markdown th:last-child, .markdown td:last-child { border-right: 0; }
    .markdown tbody tr:last-child td { border-bottom: 0; }
    .markdown th { color: #f0f1f4; background: #292a2f; font-weight: 700; white-space: nowrap; }
    .markdown tbody tr:nth-child(even) { background: rgba(255,255,255,.025); }

    .composer-area { flex: 0 0 auto; padding: 10px clamp(24px, 7vw, 108px) 20px; background: linear-gradient(transparent, var(--bg) 16%); }
    .attachment-tray { display: none; width: 100%; gap: 10px; overflow-x: auto; padding: 12px 12px 5px 5px; }
    .attachment-tray.visible { display: flex; }
    .attachment-chip { position: relative; width: 132px; height: 132px; flex: 0 0 132px; overflow: visible; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); transition: border-color .16s, box-shadow .16s, transform .16s; }
    .attachment-chip:hover { border-color: #8fa0ff; box-shadow: 0 0 0 3px rgba(111,130,232,.16); transform: translateY(-1px); }
    .attachment-image { display: block; width: 100%; height: 100%; object-fit: cover; }
    .attachment-chip .attachment-image { overflow: hidden; border-radius: 16px; }
    .attachment-remove { position: absolute; z-index: 2; top: -9px; right: -9px; display: grid; width: 27px; height: 27px; place-items: center; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; opacity: 0; color: #fff; background: rgba(15,16,18,.94); box-shadow: 0 2px 7px rgba(0,0,0,.25); font-size: 18px; line-height: 1; transition: opacity .16s, transform .16s; }
    .attachment-chip:hover .attachment-remove, .attachment-remove:focus-visible { opacity: 1; }
    .attachment-remove:hover { color: #fff; background: #111; transform: scale(1.04); }
    .message-attachments { display: flex; max-width: 78%; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
    .message-attachment { display: flex; max-width: min(420px, 68vw); max-height: 460px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: rgba(127,127,127,.08); }
    .message-attachment .attachment-image { width: auto; max-width: 100%; height: auto; max-height: 460px; object-fit: contain; }
    .attachment-error { display: none; width: min(940px, 100%); margin: 0 auto 7px; color: var(--red); font-size: 11px; }
    .attachment-error.visible { display: block; }
    .composer { display: flex; width: min(940px, 100%); min-height: 72px; flex-direction: column; align-items: stretch; gap: 5px; margin: auto; padding: 8px 10px 8px 13px; border: 1px solid #45474e; border-radius: 32px; background: var(--surface); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .composer-controls { display: flex; width: 100%; min-height: 54px; align-items: center; gap: 6px; }
    textarea { flex: 1; min-width: 0; min-height: 42px; max-height: 130px; overflow-y: auto; resize: none; padding: 10px 8px; border: 0; outline: 0; color: var(--text); background: transparent; scrollbar-width: none; font-size: 16px; line-height: 1.4; }
    textarea::-webkit-scrollbar { display: none; }
    textarea::placeholder { color: #858892; }
    .icon-btn, .send { display: grid; flex: 0 0 auto; place-items: center; border: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; color: var(--text); background: transparent; }
    .icon-btn:hover { background: rgba(127,127,127,.12); }
    .icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .send { width: 50px; height: 50px; margin-left: 2px; border-radius: 50%; color: #101114; background: #f3f3f4; }
    .send svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .send:hover:not(:disabled) { transform: scale(1.03); }
    .send:disabled { cursor: not-allowed; opacity: .4; }
    .hint { margin-top: 7px; color: #767983; font-size: 11px; text-align: center; }

    .trace { position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--sidebar); }
    .trace-head { height: var(--header-height); min-height: var(--header-height); flex: 0 0 var(--header-height); overflow: hidden; padding: 12px 17px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 650; }
    .trace-subtitle { margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .trace-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px; }
    .empty-trace { margin-top: 20px; padding: 20px; color: var(--muted); font-size: 13px; line-height: 1.7; text-align: center; }
    .turn-trace { margin-bottom: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: rgba(127,127,127,.035); }
    .turn-summary { display: flex; min-height: 52px; align-items: center; gap: 8px; padding: 11px 12px; }
    .turn-summary::after { margin-left: 2px; color: var(--muted); content: "⌄"; transition: transform .18s; }
    .turn-trace[open] > .turn-summary::after { transform: rotate(180deg); }
    .turn-title { min-width: 0; flex: 1; font-size: 12px; font-weight: 750; }
    .turn-meta { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .turn-body { padding: 0 10px 10px; }
    .turn-body > :last-child { margin-bottom: 0; }
    .graph-card, .metric-card, .tool-card, .json-card { margin-bottom: 11px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: #222327; }
    .graph-card { padding: 2px 2px 0; border: 0; border-radius: 0; background: transparent; }
    details.metric-card, details.tool-card, details.json-card { padding: 0; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details.metric-card > .card-head, details.tool-card > .card-head, details.json-card > .card-head { margin: 0; padding: 12px; }
    details.metric-card > .card-head::after, details.tool-card > .card-head::after, details.json-card > .card-head::after { margin-left: auto; color: var(--muted); content: "⌄"; transition: transform .18s; }
    details[open] > .card-head::after { transform: rotate(180deg); }
    details.metric-card > p, details.tool-card > p, details.json-card > p { padding: 0 12px 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; font-weight: 700; }
    .badge { padding: 2px 7px; border-radius: 99px; color: #aebaff; background: var(--blue-soft); font-size: 10px; }
    .graph-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .graph-node { padding: 5px 7px; border: 1px solid #3e4046; border-radius: 7px; color: #92959e; background: #292a2f; font-size: 10px; transition: .2s; }
    .graph-node.active { border-color: #7388f2; color: #e6eaff; box-shadow: 0 0 0 2px rgba(77,107,254,.12); }
    .graph-node.done { border-color: #397d6b; color: #9be1cc; }
    .graph-arrow { color: #5f626b; font-size: 10px; }
    .graph-edges { margin-top: 10px; padding: 8px; border-radius: 7px; color: #7f828c; background: #1d1e22; font: 9px/1.55 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; }
    .timeline { margin-top: 13px; padding-left: 8px; }
    .run-step { position: relative; padding: 0 0 14px 18px; border-left: 1px solid #3c3e44; }
    .run-step:last-child { border-left-color: transparent; }
    .run-step::before { position: absolute; top: 1px; left: -5px; width: 9px; height: 9px; border: 2px solid #222327; border-radius: 50%; background: var(--green); content: ""; }
    .step-title { display: flex; justify-content: space-between; gap: 8px; color: #d8dae0; font-size: 11px; font-weight: 650; }
    .step-title::after { margin-left: auto; color: var(--muted); content: "⌄"; }
    .run-step[open] > .step-title::after { transform: rotate(180deg); }
    .step-content { padding-top: 2px; }
    .step-edge, .step-detail { margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }
    .tool-call { margin-top: 6px; border-radius: 7px; background: #2b2c31; color: #b9bcc5; font: 10px/1.5 "SFMono-Regular", Consolas, monospace; overflow: hidden; }
    .tool-call > summary { padding: 7px; color: #cdd0d8; }
    .tool-call > pre { max-height: 240px; margin: 0; overflow: auto; padding: 0 7px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .search-pipeline { margin: 0 7px 8px; padding: 7px 8px; border-left: 1px solid #596ed5; color: var(--muted); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .search-output-items { display: grid; gap: 6px; margin: 0 7px 8px; }
    .search-output-item { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(127,127,127,.055); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .search-output-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text); font-size: 10px; font-weight: 750; }
    .search-output-detail { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .search-stage { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 7px; padding: 4px 0; }
    .search-stage-dot { width: 6px; height: 6px; margin-top: 5px; border-radius: 50%; background: var(--green); }
    .search-stage.partial .search-stage-dot { background: #e6ad45; }
    .search-stage.error .search-stage-dot { background: var(--red); }
    .search-stage-title { color: var(--text); font-size: 10px; font-weight: 650; }
    .search-stage-detail { margin-top: 1px; color: var(--muted); font-size: 9px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .metric-card p, .tool-card p, .json-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .tool-card { max-height: 230px; overflow: auto; }
    .state-action { flex: 0 0 auto; margin: 0 14px 14px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #25262a; font-size: 12px; }
    .state-action:hover { border-color: #596ed5; }

    .state-overlay { position: absolute; z-index: 5; inset: 0; display: flex; min-height: 0; flex-direction: column; background: var(--sidebar); opacity: 0; pointer-events: none; transform: translateX(20px); transition: opacity .18s, transform .18s; }
    .state-overlay.visible { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .state-overlay-head { display: flex; height: var(--header-height); min-height: var(--header-height); flex: 0 0 var(--header-height); align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .state-back { padding: 7px 9px; border: 0; border-radius: 8px; color: var(--text); background: transparent; }
    .state-back:hover { background: var(--surface); }
    .state-tree { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
    .state-branch { margin: 2px 0; }
    .state-branch > summary { display: flex; align-items: center; gap: 7px; padding: 7px 5px; border-radius: 6px; font: 11px/1.4 "SFMono-Regular", Consolas, monospace; }
    .state-branch > summary:hover { background: rgba(127,127,127,.07); }
    .state-branch > summary::before { color: #8194f8; content: "▸"; transition: transform .15s; }
    .state-branch[open] > summary::before { transform: rotate(90deg); }
    .state-kind { margin-left: auto; color: var(--muted); font-size: 9px; }
    .state-children { margin-left: 9px; padding: 0 0 4px 12px; border-left: 1px solid var(--line); }
    .state-leaf { display: grid; grid-template-columns: minmax(70px, .65fr) 1.35fr; gap: 8px; padding: 6px 8px; border-top: 1px solid var(--line); font: 10px/1.5 "SFMono-Regular", Consolas, monospace; }
    .state-key { color: #899cf8; overflow-wrap: anywhere; }
    .state-value { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .state-long > summary { padding: 7px 8px; color: #899cf8; font: 10px/1.4 "SFMono-Regular", Consolas, monospace; }
    .state-long pre { max-height: 300px; margin: 0; overflow: auto; padding: 0 8px 8px; color: var(--muted); font: 10px/1.5 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

    .modal-backdrop { position: fixed; z-index: 100; inset: 0; display: grid; padding: 20px; place-items: center; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .16s; }
    .modal-backdrop.visible { opacity: 1; pointer-events: auto; }

<body>

  <div class="modal-backdrop" id="deleteModal" aria-hidden="true">

      <h2 id="deleteModalTitle">删除对话？</h2>

  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#chatForm');
    const question = document.querySelector('#question');
    const sendButton = document.querySelector('#sendButton');
    const sessionList = document.querySelector('#sessionList');
    const conversationTitle = document.querySelector('#conversationTitle');
    const traceBody = document.querySelector('#traceBody');
    const attachmentInput = document.querySelector('#attachmentInput');
    const attachmentButton = document.querySelector('#attachmentButton');
    const attachmentTray = document.querySelector('#attachmentTray');
    const attachmentError = document.querySelector('#attachmentError');
    const jumpBottom = document.querySelector('#jumpBottom');
    const appShell = document.querySelector('#appShell');
    const drawerToggle = document.querySelector('#drawerToggle');
    const drawerReopen = document.querySelector('#drawerReopen');
    const themeToggle = document.querySelector('#themeToggle');
    const stateOverlay = document.querySelector('#stateOverlay');
    const stateTree = document.querySelector('#stateTree');
    const deleteModal = document.querySelector('#deleteModal');
    const deleteSessionTitle = document.querySelector('#deleteSessionTitle');
    const deleteModalError = document.querySelector('#deleteModalError');
    const confirmDeleteButton = document.querySelector('#confirmDelete');
    let currentSessionId = localStorage.getItem('gamerover-session-id') || createSessionId();
    let busy = false;
    let sessions = [];
    let graphNodes = new Map();
    let timeline = null;
    let currentTurnBody = null;
    let currentTurnShell = null;
    let currentBudgetCard = null;
    let pendingDeleteSession = null;
    let pendingAttachments = [];
    const savedDrawerState = localStorage.getItem('gamerover-drawer-closed');
    let drawerClosed = savedDrawerState === null ? window.matchMedia('(max-width: 760px)').matches : savedDrawerState === 'true';

    const drawerIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" stroke-width="1.8"></rect><path d="M9 4v16" stroke-width="1.8"></path></svg>';
    const sunIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"></circle><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.64 5.64l1.06 1.06M17.3 17.3l1.06 1.06M18.36 5.64 17.3 6.7M6.7 17.3l-1.06 1.06" stroke-width="1.35"></path></svg>';
    const moonIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 15.2A8 8 0 0 1 8.8 4.8a8 8 0 1 0 10.4 10.4Z" fill="currentColor" stroke="none"></path></svg>';
    const copyIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="12" height="12" rx="3" stroke-width="1.8"></rect><rect x="4" y="8" width="12" height="12" rx="3" stroke-width="1.8"></rect></svg>';
    const copiedIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke-width="2"></path></svg>';

    function applyDrawerState() {
      appShell.classList.toggle('drawer-closed', drawerClosed);
      drawerToggle.innerHTML = drawerIcon;
      drawerReopen.innerHTML = drawerIcon;
      localStorage.setItem('gamerover-drawer-closed', String(drawerClosed));
    }
    function applyTheme() {
      const theme = document.documentElement.dataset.theme || 'dark';
      themeToggle.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
      themeToggle.title = theme === 'dark' ? '切换到浅色主题' : '切换到深色主题';
      themeToggle.setAttribute('aria-label', themeToggle.title);
    }
    function closeStateView() {
      stateOverlay.classList.remove('visible');
      stateOverlay.setAttribute('aria-hidden', 'true');
    }
    applyDrawerState();
    applyTheme();

    function createSessionId() { return `game-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
    function saveCurrentSession() { localStorage.setItem('gamerover-session-id', currentSessionId); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function formatDuration(milliseconds) {
      const value = Math.max(0, Number(milliseconds) || 0);
      if (value < 1000) return `${Math.max(1, Math.round(value))}ms`;
      if (value < 10000) return `${(value / 1000).toFixed(2)}s`;
      return `${(value / 1000).toFixed(1)}s`;
    }
    function inlineMarkdown(value) {
      const placeholders = [];
      let text = value.replace(/`([^`]+)`/g, (_, code) => { placeholders.push(`<code>${code}</code>`); return `@@MD${placeholders.length - 1}@@`; });
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => { placeholders.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`); return `@@MD${placeholders.length - 1}@@`; });
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
      text = text.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
      return text.replace(/@@MD(\d+)@@/g, (_, index) => placeholders[Number(index)]);
    }
    function renderMarkdown(source) {
      const lines = escapeHtml(source || '').split('\n');
      const html = [];
      let list = null;
      let paragraph = [];
      let code = false;
      let codeLines = [];
      let nextOrderedNumber = 1;
      const closeParagraph = () => { if (paragraph.length) { html.push(`<p>${paragraph.map(inlineMarkdown).join('<br>')}</p>`); paragraph = []; } };
      const closeList = () => { if (list) { html.push(`</${list}>`); list = null; } };
      const tableCells = line => {
        let value = line.trim();
        if (!value.includes('|')) return null;
        if (value.startsWith('|')) value = value.slice(1);
        if (value.endsWith('|')) value = value.slice(0, -1);
        const cells = value.split('|').map(cell => cell.trim());
        return cells.length > 1 ? cells : null;
      };
      const tableAlignment = cell => {
        const value = cell.trim();
        if (!/^:?-{3,}:?$/.test(value)) return null;
        if (value.startsWith(':') && value.endsWith(':')) return 'center';
        if (value.endsWith(':')) return 'right';
        return 'left';
      };
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (line.startsWith('```')) { closeParagraph(); closeList(); nextOrderedNumber = 1; if (code) { html.push(`<pre><code>${codeLines.join('\n')}</code></pre>`); codeLines = []; } code = !code; continue; }
        if (code) { codeLines.push(line); continue; }
        const headers = tableCells(line);
        const separators = index + 1 < lines.length ? tableCells(lines[index + 1]) : null;
        const alignments = separators?.map(tableAlignment);
        if (headers && separators && headers.length === separators.length && alignments.every(Boolean)) {
          closeParagraph(); closeList(); nextOrderedNumber = 1;
          const rows = [];
          index += 2;
          while (index < lines.length) {
            const cells = tableCells(lines[index]);
            if (!cells || cells.length !== headers.length) break;
            rows.push(cells);
            index += 1;
          }
          index -= 1;
          const head = headers.map((cell, cellIndex) => `<th style="text-align:${alignments[cellIndex]}">${inlineMarkdown(cell)}</th>`).join('');
          const body = rows.map(cells => `<tr>${cells.map((cell, cellIndex) => `<td style="text-align:${alignments[cellIndex]}">${inlineMarkdown(cell)}</td>`).join('')}</tr>`).join('');
          html.push(`<div class="markdown-table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const bullet = line.match(/^\s*[-*+]\s+(.+)$/);
        const ordered = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
        if (!line.trim()) { closeParagraph(); closeList(); continue; }
        if (/^---+$/.test(line.trim())) { closeParagraph(); closeList(); nextOrderedNumber = 1; html.push('<hr>'); continue; }
        if (heading) { closeParagraph(); closeList(); nextOrderedNumber = 1; const level = heading[1].length; html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`); continue; }
        if (line.startsWith('&gt; ')) { closeParagraph(); closeList(); nextOrderedNumber = 1; html.push(`<blockquote>${inlineMarkdown(line.slice(5))}</blockquote>`); continue; }
        if (bullet) { closeParagraph(); if (list !== 'ul') { closeList(); list = 'ul'; html.push('<ul>'); } html.push(`<li>${inlineMarkdown(bullet[1])}</li>`); continue; }
        if (ordered) {
          closeParagraph();
          const explicitNumber = Number(ordered[1]);
          const start = explicitNumber > 1 ? explicitNumber : nextOrderedNumber;
          if (list !== 'ol') { closeList(); list = 'ol'; html.push(`<ol${start === 1 ? '' : ` start="${start}"`}>`); }
          html.push(`<li>${inlineMarkdown(ordered[2])}</li>`); nextOrderedNumber = start + 1; continue;
        }
        closeList(); nextOrderedNumber = 1; paragraph.push(line);
      }
      closeParagraph(); closeList();
      if (codeLines.length) html.push(`<pre><code>${codeLines.join('\n')}</code></pre>`);
      return html.join('');
    }
    function welcomeMarkup() {
      return `<div class="welcome"><div class="welcome-symbol">✣</div><h1>我是 GameRover</h1><p>可以查询玩法、角色、任务与版本资讯，也会在右侧实时展示 Agent 经过的图节点、边和 Tool Calling。</p><div class="suggestions"><button class="suggestion" data-prompt="艾尔登法环的新手开荒路线怎么规划？">艾尔登法环开荒建议</button><button class="suggestion" data-prompt="绝区零最近有什么版本更新？">绝区零最新资讯</button><button class="suggestion" data-prompt="我在明日方舟卡关了，有点烦，陪我聊聊。">聊聊游戏挫败</button></div></div>`;
    }
    function showWelcome() { document.querySelector('.chat').classList.add('welcome-mode'); messages.innerHTML = welcomeMarkup(); bindSuggestions(); }
    function bindSuggestions() { document.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => send(button.dataset.prompt))); }
    function scrollToBottom(force = false) {
      const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 140;
      if (force || nearBottom) messages.scrollTop = messages.scrollHeight;
    }
    function attachmentMarkup(item) { return `<img class="attachment-image" src="${item.data_url}" alt="">`; }
    function showAttachmentError(message = '') { attachmentError.textContent = message; attachmentError.classList.toggle('visible', Boolean(message)); }
    function renderAttachmentTray() {
      attachmentTray.replaceChildren();
      pendingAttachments.forEach(item => {
        const chip = document.createElement('div'); chip.className = 'attachment-chip'; chip.innerHTML = attachmentMarkup(item);
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'attachment-remove'; remove.title = '移除附件'; remove.textContent = '×';
        remove.addEventListener('click', () => { pendingAttachments = pendingAttachments.filter(file => file.id !== item.id); renderAttachmentTray(); });
        chip.append(remove); attachmentTray.append(chip);
      });
      attachmentTray.classList.toggle('visible', pendingAttachments.length > 0);
    }
    function readAsDataUrl(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error(`无法读取 ${file.name}`)); reader.readAsDataURL(file); }); }
    async function addSelectedAttachments(files) {
      showAttachmentError();
      const slots = 5 - pendingAttachments.length;
      if (slots <= 0) { showAttachmentError('每次最多上传 5 个附件'); return; }
      const selected = [...files].slice(0, slots);
      if (selected.some(file => file.size > 10 * 1024 * 1024)) { showAttachmentError('单个附件不能超过 10MB'); return; }
      if (pendingAttachments.reduce((sum, item) => sum + item.size, 0) + selected.reduce((sum, file) => sum + file.size, 0) > 20 * 1024 * 1024) { showAttachmentError('本轮附件总大小不能超过 20MB'); return; }
      try {
        const loaded = await Promise.all(selected.map(async file => ({id: crypto.randomUUID(), name: file.name, mime_type: file.type || 'application/octet-stream', size: file.size, data_url: await readAsDataUrl(file)})));
        pendingAttachments.push(...loaded); renderAttachmentTray();
      } catch (error) { showAttachmentError(error.message); }
      finally { attachmentInput.value = ''; }
    }
    function addMessage(role, text, temporary = false, attachments = []) {
      document.querySelector('.chat').classList.remove('welcome-mode');
      messages.querySelector('.welcome')?.remove();
      const row = document.createElement('div'); row.className = `message ${role}`;
      const bubble = document.createElement('div'); bubble.className = `bubble${temporary ? ' thinking' : ''}`;
      if (attachments.length) {
        const files = document.createElement('div'); files.className = 'message-attachments';
        attachments.forEach(item => { const chip = document.createElement('div'); chip.className = 'message-attachment'; chip.innerHTML = attachmentMarkup(item); files.append(chip); });
        row.append(files);
      }
      if (role === 'assistant' && !temporary) { bubble.classList.add('markdown'); bubble.insertAdjacentHTML('beforeend', renderMarkdown(text)); }
      else { const content = document.createElement('div'); content.textContent = text; bubble.append(content); }
      row.append(bubble);
      if (role === 'assistant' && !temporary) {
        const actions = document.createElement('div'); actions.className = 'message-actions';
        const copy = document.createElement('button'); copy.className = 'copy-btn'; copy.type = 'button'; copy.innerHTML = copyIcon; copy.title = '复制'; copy.setAttribute('aria-label', '复制回答');
        copy.addEventListener('click', async () => { await navigator.clipboard.writeText(text); copy.innerHTML = copiedIcon; copy.title = '已复制'; setTimeout(() => { copy.innerHTML = copyIcon; copy.title = '复制'; }, 1200); });
        actions.append(copy); row.append(actions);
      }
      messages.append(row); scrollToBottom(true); return row;
    }
    function makeCard(className, title, badge, body, open = className === 'metric-card') {
      const box = document.createElement('details'); box.className = className; box.open = open;
      const head = document.createElement('summary'); head.className = 'card-head';
      const name = document.createElement('span'); name.textContent = title;
      const tag = document.createElement('span'); tag.className = 'badge'; tag.textContent = badge;
      const content = document.createElement('p'); content.textContent = body;
      head.append(name, tag); box.append(head, content); return box;
    }
    function renderStateValue(key, value, depth = 0) {
      const isObject = value !== null && typeof value === 'object';
      if (isObject) {
        const branch = document.createElement('details'); branch.className = 'state-branch'; branch.open = depth === 0;
        const summary = document.createElement('summary');
        const label = document.createElement('span'); label.textContent = key;
        const kind = document.createElement('span'); kind.className = 'state-kind'; kind.textContent = Array.isArray(value) ? `Array(${value.length})` : `Object(${Object.keys(value).length})`;

          if (!streamed) return;
          loadingBubble.classList.remove('thinking', 'markdown'); loadingBubble.classList.add('streaming-text');
          if (!streamTextNode) { streamTextNode = document.createTextNode(''); loadingBubble.replaceChildren(streamTextNode); }
          streamTextNode.data = streamed; scrollToBottom();
        };
        const scheduleStreamRender = () => {
          if (streamRenderFrame) return;
          streamRenderFrame = requestAnimationFrame(flushStreamRender);
        };
        const resetStreamRender = status => {
          if (streamRenderFrame) { cancelAnimationFrame(streamRenderFrame); streamRenderFrame = null; }
          streamed = ''; streamTextNode = null; loadingBubble.className = 'bubble thinking'; loadingBubble.textContent = status;
        };
        while (true) {
          const {value, done} = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
          const blocks = buffer.split('\n\n'); buffer = blocks.pop() || '';
          for (const block of blocks) {
            if (!block.trim()) continue;
            const packet = parseSseBlock(block);
            if (packet.event === 'graph') startGraph(packet.data);
            else if (packet.event === 'token') { streamed += packet.data.content || ''; scheduleStreamRender(); }
            else if (packet.event === 'node') {
              appendNode(packet.data);
              const requestedTools = packet.data.tool_calls || [];
              if (packet.data.node === 'ContextCompaction') loadingBubble.textContent = '正在理解问题与附件…';
              else if (packet.data.node === 'Agent' && requestedTools.length) {
                resetStreamRender(`正在执行 ${requestedTools.map(call => call.name).join('、')}…`);
              } else if (packet.data.node === 'ToolExecution') loadingBubble.textContent = '正在结合搜索证据生成回答…';
              else if (packet.data.node === 'ForceFinish') loadingBubble.textContent = '正在整理现有证据…';
            }
            else if (packet.event === 'trace') appendTrace(packet.data);
            else if (packet.event === 'final') finalData = packet.data;
            else if (packet.event === 'error') throw new Error(packet.data.detail);
          }
          if (done) break;
        }
        flushStreamRender();
        if (!finalData) throw new Error('流式响应未返回最终结果');
        loading.remove(); addMessage('assistant', finalData.answer); appendFinalTrace(finalData); saveCurrentSession(); await refreshSessionsOnly();
      } catch (error) { loading.remove(); addMessage('assistant', `请求失败：${error.message}`); if (currentTurnShell) { currentTurnShell.badge.textContent = '失败'; currentTurnShell.detail.textContent = error.message; } }
      finally { busy = false; sendButton.disabled = false; question.focus(); }
    }
    async function refreshSessionsOnly() { const response = await fetch('/ai/sessions'); sessions = (await response.json()).sessions || []; const active = sessions.find(item => item.session_id === currentSessionId); if (active) conversationTitle.textContent = active.title; renderSessionList(); }

    messages.addEventListener('scroll', () => { const away = messages.scrollHeight - messages.scrollTop - messages.clientHeight > 220; jumpBottom.classList.toggle('visible', away); });
    jumpBottom.addEventListener('click', () => scrollToBottom(true));
    drawerToggle.addEventListener('click', () => { drawerClosed = !drawerClosed; applyDrawerState(); });
    drawerReopen.addEventListener('click', () => { drawerClosed = false; applyDrawerState(); });
    themeToggle.addEventListener('click', () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('gamerover-theme', next); applyTheme(); });
    document.addEventListener('click', closeSessionMenus);
    document.querySelector('#cancelDelete').addEventListener('click', closeDeleteModal);
    confirmDeleteButton.addEventListener('click', confirmDeleteSession);
    deleteModal.addEventListener('click', event => { if (event.target === deleteModal) closeDeleteModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && deleteModal.classList.contains('visible')) closeDeleteModal(); });
    document.querySelector('#closeState').addEventListener('click', closeStateView);
    form.addEventListener('submit', event => { event.preventDefault(); send(question.value); });
    question.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
    question.addEventListener('input', () => { question.style.height = 'auto'; question.style.height = `${Math.min(question.scrollHeight, 150)}px`; });
    attachmentButton.addEventListener('click', () => attachmentInput.click());
    attachmentInput.addEventListener('change', () => addSelectedAttachments(attachmentInput.files));
    document.querySelector('#newSession').addEventListener('click', () => { if (busy) return; closeStateView(); currentSessionId = createSessionId(); saveCurrentSession(); conversationTitle.textContent = '新对话'; renderSessionList(); showWelcome(); currentTurnBody = null; currentTurnShell = null; traceBody.innerHTML = '<div class="empty-trace">新会话尚未执行。发送消息后将实时展示图执行过程。</div>'; if (window.matchMedia('(max-width: 760px)').matches) { drawerClosed = true; applyDrawerState(); } });
    document.querySelector('#inspectState').addEventListener('click', async () => { try { const response = await fetch(`/ai/sessions/${encodeURIComponent(currentSessionId)}/state`); const data = await response.json(); if (!response.ok) throw new Error(data.detail || '暂无状态'); showStateView(data); } catch (error) { stateTree.replaceChildren(makeCard('json-card', '查看状态失败', 'error', error.message, true)); stateOverlay.classList.add('visible'); } });
    loadSessions().catch(error => { sessionList.innerHTML = `<div class="history-empty">加载失败：${escapeHtml(error.message)}</div>`; showWelcome(); });
  </script>
</body>
</html>
