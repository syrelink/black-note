version: "3.9"

# 小黑书 — 开发环境基础服务
# 启动：docker compose up -d
# 停止：docker compose down

services:

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: black-note-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: black_note

  # ── Qdrant ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: black-note-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: black-note-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── MinIO ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: black-note-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # Web Console  →  http://localhost:9003
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
  minio_data:
